    <script>
      // Ensure window.fetch has both a getter and a setter so scripts trying to patch or assign fetch do not fail with "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _rawFetch = window.fetch;
          var _fetchHandler = typeof _rawFetch === 'function' ? function() {
            return _rawFetch.apply(window, arguments);
          } : undefined;

          function safePatch(target) {
            if (!target) return;
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (!desc || desc.configurable) {
                Object.defineProperty(target, 'fetch', {
                  get: function() {
                    return _fetchHandler;
                  },
                  set: function(newHandler) {
                    _fetchHandler = newHandler;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (err) {}
          }

          safePatch(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            safePatch(Window.prototype);
          }

          // Safety error listener to intercept unhandled "Cannot set property fetch" errors
          window.addEventListener('error', function(event) {
            if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);
        } catch (e) {
          // If already defined or protected, continue safely
        }
      })();
    </script>
